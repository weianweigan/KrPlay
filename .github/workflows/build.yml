name: Release KrPlay

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.4.2 (required when dispatching from a branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: krplay-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check out requested tag source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require an existing version tag before building
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_tag.py

      - name: Check repository contents and distribution tests
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android platforms and build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Set up Gradle 9.3.1 and cache
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '9.3.1'

      - name: Verify protocol and TCP bridge
        shell: bash
        run: |
          gradle_lib="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")/lib"
          python3 scripts/test.py --jdk "$JAVA_HOME" --kotlin-lib-dir "$gradle_lib"

      - name: Verify receiver navigation and protocol
        working-directory: krplay
        run: ./gradlew --no-daemon :common:testDebugUnitTest :shared:testDebugUnitTest

      - name: Test and build tag-versioned car client
        working-directory: krplay-client
        run: ./gradlew --no-daemon testDebugUnitTest exportKrPlayDebug

      - name: Download, verify and extract pinned authentication files
        run: python3 scripts/download_auth_assets.py --output "$RUNNER_TEMP/krplay-auth"

      - name: Build and verify provisioned receiver
        working-directory: krplay
        env:
          KRPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/krplay-auth
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache :mobile:assembleProvisionedDebug :mobile:exportKrPlayDebug

      - name: Verify APKs and package exact source, licenses and release notes
        env:
          KRPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/krplay-auth
        run: python3 scripts/package_artifacts.py --release-auth

      - name: Remove extracted authentication files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/krplay-auth"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KrPlay-${{ steps.tag.outputs.tag }}-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.android.outputs.tag }}
      BUILD_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out the exact built commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.android.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified build bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: KrPlay-${{ needs.android.outputs.tag }}-${{ github.run_id }}
          path: dist/release

      - name: Publish all assets to the tag release
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG"
